[package]
name = "echo"
version = "1.1.1"
description = "Écho, lecteur de musique locale"
edition = "2021"
rust-version = "1.83"

[[bin]]
name = "echo-player"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Embarque l'interface dans le binaire. Sans cette option, Tauri lit les
# fichiers de src/ au démarrage (mode développement).
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.22"
souvlaki = "0.8"
notify = "8"
discord-rich-presence = "1"
tauri-plugin-notification = "2"

# Déjà utilisé par Tauri sous Linux : seulement pour régler le cache du moteur d'affichage.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
# Pochettes des vidéos : une image décodée hors de l'interface (GStreamer est déjà là).
gstreamer = "0.24"
jpeg-encoder = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
