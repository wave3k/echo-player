[package]
name = "echo"
version = "1.0.0"
description = "Écho, lecteur de musique et de vidéos locales"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Embarque l'interface dans le binaire. Sans cette option, Tauri lit les
# fichiers de src/ au démarrage (mode développement).
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.22"
base64 = "0.22"
souvlaki = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
