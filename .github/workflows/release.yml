# Compile Écho pour Windows et Linux et ajoute les fichiers à la release du tag.
# Linux est compilé sur Ubuntu 22.04 : une glibc ancienne, donc des paquets qui
# fonctionnent aussi sur les distributions plus anciennes (Debian 12, Mint 21…).
# Se lance à chaque tag « v* » (ex. v1.0.0), ou à la main depuis l'onglet Actions.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à compléter (ex. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libunwind-14-dev (préinstallé) bloque libunwind-dev, requis par libgstreamer1.0-dev.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: |
          cd src-tauri && cargo test
          cd .. && node --test tests/logic.test.js

      # Les fichiers de mise à jour (.sig, latest.json) sont signés avec la clé d'Écho.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Écho ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: false
          args: --bundles ${{ matrix.bundles }}

      # Installation par install.sh : le binaire seul, en archive signée.
      - name: Archive signée du binaire Linux
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tar -czf echo-player-linux-x86_64.tar.gz -C src-tauri/target/release echo-player
          npx --yes @tauri-apps/cli@2 signer sign echo-player-linux-x86_64.tar.gz
          gh release upload "$TAG" echo-player-linux-x86_64.tar.gz echo-player-linux-x86_64.tar.gz.sig --clobber

  # latest.json reçoit l'entrée « linux-x86_64-bin » (binaire installé par install.sh).
  updater-binary:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Ajoute l'archive du binaire à latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p latest.json -p echo-player-linux-x86_64.tar.gz.sig
          sig=$(cat echo-player-linux-x86_64.tar.gz.sig)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/echo-player-linux-x86_64.tar.gz"
          jq --arg s "$sig" --arg u "$url" '.platforms["linux-x86_64-bin"] = {signature: $s, url: $u}' latest.json > merged.json
          mv merged.json latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
