# Compile Écho pour Windows et ajoute l'installateur à la release du tag.
# Les paquets Linux (.deb, AppImage) sont compilés et ajoutés à la main.
# Se lance à chaque tag « v* » (ex. v1.0.0), ou à la main depuis l'onglet Actions.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à compléter (ex. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: |
          cd src-tauri && cargo test
          cd .. && node --test tests/logic.test.js

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Écho ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: false
          args: --bundles ${{ matrix.bundles }}
