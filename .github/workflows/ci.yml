# Vérifie chaque push et chaque pull request : tests de l'interface, tests du cœur,
# clippy et dépendances connues comme vulnérables. Les releases restent dans release.yml.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de l'interface
        run: node --test tests/*.test.js

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  coeur:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système
        run: |
          sudo apt-get update
          # libunwind-14-dev (préinstallé) bloque libunwind-dev, requis par libgstreamer1.0-dev.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev libgstreamer1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tests du cœur
        working-directory: src-tauri
        run: cargo test

      # Avertissements affichés sans bloquer, le temps de les traiter une première fois.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets
